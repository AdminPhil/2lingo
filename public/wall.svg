<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- Ground Grass Base -->
  <rect y="31" width="36" height="5" rx="1.5" fill="#16A34A"/>
  <!-- Mortar Foundation / Wall Backing -->
  <rect x="2" y="7" width="32" height="24" rx="2" fill="#94A3B8"/>
  
  <!-- Brick Row 1 (y: 8 to 13) -->
  <rect x="3" y="8" width="9" height="5" rx="1" fill="#DC2626"/>
  <rect x="13.5" y="8" width="9" height="5" rx="1" fill="#EA580C"/>
  <rect x="24" y="8" width="9" height="5" rx="1" fill="#DC2626"/>
  
  <!-- Brick Row 2 (y: 14 to 19, Staggered) -->
  <rect x="3" y="14" width="4" height="5" rx="1" fill="#B91C1C"/>
  <rect x="8.5" y="14" width="9" height="5" rx="1" fill="#EF4444"/>
  <rect x="19" y="14" width="9" height="5" rx="1" fill="#EA580C"/>
  <rect x="29.5" y="14" width="3.5" height="5" rx="1" fill="#B91C1C"/>
  
  <!-- Brick Row 3 (y: 20 to 25) -->
  <rect x="3" y="20" width="9" height="5" rx="1" fill="#EA580C"/>
  <rect x="13.5" y="20" width="9" height="5" rx="1" fill="#DC2626"/>
  <rect x="24" y="20" width="9" height="5" rx="1" fill="#EF4444"/>
  
  <!-- Brick Row 4 (y: 26 to 30, Staggered) -->
  <rect x="3" y="26" width="4.5" height="4.5" rx="1" fill="#DC2626"/>
  <rect x="9" y="26" width="9" height="4.5" rx="1" fill="#B91C1C"/>
  <rect x="19.5" y="26" width="9" height="4.5" rx="1" fill="#EA580C"/>
  <rect x="30" y="26" width="3" height="4.5" rx="1" fill="#DC2626"/>
  
  <!-- Wall Cap / Stone Coping on Top -->
  <rect x="1" y="5" width="34" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="1" y="7" width="34" height="0.8" fill="#CBD5E1"/>
</svg>