<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" xml:space="preserve">
  <!-- Swing Set Top Beam -->
  <rect x="3" y="4" width="30" height="2.5" rx="1.2" fill="#2B7A78" />
  
  <!-- Left A-Frame Legs -->
  <line x1="6" y1="5" x2="2" y2="33" stroke="#3AAFA9" stroke-width="2" stroke-linecap="round" />
  <line x1="7" y1="5" x2="11" y2="33" stroke="#2B7A78" stroke-width="2" stroke-linecap="round" />
  <!-- Left Crossbar -->
  <line x1="3.8" y1="22" x2="9.5" y2="22" stroke="#17252A" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  
  <!-- Right A-Frame Legs -->
  <line x1="29" y1="5" x2="25" y2="33" stroke="#2B7A78" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="5" x2="34" y2="33" stroke="#3AAFA9" stroke-width="2" stroke-linecap="round" />
  <!-- Right Crossbar -->
  <line x1="26.5" y1="22" x2="32.2" y2="22" stroke="#17252A" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Swing Ropes / Chains -->
  <line x1="14.5" y1="6.5" x2="14.5" y2="23" stroke="#8D99AE" stroke-width="1.2" stroke-dasharray="1.5 1" stroke-linecap="round" />
  <line x1="21.5" y1="6.5" x2="21.5" y2="23" stroke="#8D99AE" stroke-width="1.2" stroke-dasharray="1.5 1" stroke-linecap="round" />
  
  <!-- Swing Seat Hooks -->
  <circle cx="14.5" cy="23.5" r="0.8" fill="#4A4E69" />
  <circle cx="21.5" cy="23.5" r="0.8" fill="#4A4E69" />

  <!-- Swing Wooden Seat -->
  <rect x="12" y="24" width="12" height="3" rx="1.2" fill="#E07A5F" />
  <rect x="13" y="24" width="10" height="1.2" rx="0.6" fill="#F4A261" />

  <!-- Grass Tufts at Base -->
  <path d="M1 34 Q2 32 3 34 Q4 31 5 34" fill="none" stroke="#68D391" stroke-width="1.2" stroke-linecap="round" />
  <path d="M31 34 Q32 32 33 34 Q34 31 35 34" fill="none" stroke="#68D391" stroke-width="1.2" stroke-linecap="round" />
</svg>
