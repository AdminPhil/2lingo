<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- Bakery Shop Front (Pekara) -->
  <!-- Building Body -->
  <rect x="3" y="10" width="30" height="23" rx="2" fill="#FFE8D6"/>
  <rect x="3" y="29" width="30" height="4" fill="#D4A373"/>
  
  <!-- Bakery Roof / Upper Wall -->
  <rect x="2" y="5" width="32" height="6" rx="1.5" fill="#C87D55"/>
  <rect x="6" y="6" width="24" height="4" rx="1" fill="#FAEDCD"/>
  <text x="18" y="9.2" font-family="Arial, sans-serif" font-size="3" font-weight="900" fill="#7F4F24" text-anchor="middle" letter-spacing="0.5">PEKARA</text>

  <!-- Striped Awning -->
  <path d="M1 11 L35 11 L33 16 Q31 18 29 16 Q27 18 25 16 Q23 18 21 16 Q19 18 17 16 Q15 18 13 16 Q11 18 9 16 Q7 18 5 16 Q3 18 1 16 Z" fill="#E63946"/>
  <!-- White Awning Stripes -->
  <path d="M5 11 L9 11 L7 16 Q5 18 5 16 Z" fill="#F1FAEE"/>
  <path d="M13 11 L17 11 L15 16 Q13 18 13 16 Z" fill="#F1FAEE"/>
  <path d="M21 11 L25 11 L23 16 Q21 18 21 16 Z" fill="#F1FAEE"/>
  <path d="M29 11 L33 11 L31 16 Q29 18 29 16 Z" fill="#F1FAEE"/>

  <!-- Shop Window with Bread Display -->
  <rect x="5" y="19" width="13" height="10" rx="1" fill="#A8DADC" stroke="#457B9D" stroke-width="0.8"/>
  <rect x="6" y="24" width="11" height="4" rx="0.5" fill="#DDB892"/>
  <!-- Loaves in Window -->
  <ellipse cx="8.5" cy="23.5" rx="2" ry="1.2" fill="#B07D62"/>
  <ellipse cx="13" cy="23.5" rx="2.5" ry="1.2" fill="#DDA15E"/>
  <!-- Window Glare -->
  <path d="M6 20 L11 20 L7 25 L6 25 Z" fill="#FFFFFF" opacity="0.4"/>

  <!-- Bakery Door -->
  <rect x="21" y="18" width="10" height="15" rx="1" fill="#7F4F24"/>
  <rect x="22.5" y="19.5" width="7" height="6" rx="0.5" fill="#E9EDC9"/>
  <!-- Door Glass Glare & Bread Icon -->
  <ellipse cx="26" cy="22.5" rx="1.8" ry="1" fill="#DDA15E"/>
  <!-- Door Handle -->
  <circle cx="22.5" cy="27" r="0.8" fill="#FAEDCD"/>
</svg>
