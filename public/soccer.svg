<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- Soccer Pitch / Sport (Nogomet) -->
  <!-- Green Pitch Background -->
  <rect x="2" y="3" width="32" height="30" rx="3" fill="#2E7D32"/>
  <rect x="3" y="4" width="30" height="28" rx="2" fill="#388E3C"/>
  
  <!-- Alternating Grass Stripes -->
  <rect x="3" y="4" width="30" height="4.6" fill="#43A047" opacity="0.35"/>
  <rect x="3" y="13.2" width="30" height="4.6" fill="#43A047" opacity="0.35"/>
  <rect x="3" y="22.4" width="30" height="4.6" fill="#43A047" opacity="0.35"/>

  <!-- Field White Markings -->
  <!-- Outer Boundary -->
  <rect x="4" y="5" width="28" height="26" fill="none" stroke="#FFFFFF" stroke-width="0.9" opacity="0.9"/>
  <!-- Center Halfway Line -->
  <line x1="4" y1="18" x2="32" y2="18" stroke="#FFFFFF" stroke-width="0.9" opacity="0.9"/>
  <!-- Center Circle -->
  <circle cx="18" cy="18" r="4.5" fill="none" stroke="#FFFFFF" stroke-width="0.9" opacity="0.9"/>
  <circle cx="18" cy="18" r="0.75" fill="#FFFFFF"/>

  <!-- Penalty / Goal Box Top -->
  <rect x="11" y="5" width="14" height="6.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9"/>
  <rect x="13.5" y="5" width="9" height="3" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.9"/>
  
  <!-- Penalty / Goal Box Bottom -->
  <rect x="11" y="24.5" width="14" height="6.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9"/>
  <rect x="13.5" y="28" width="9" height="3" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.9"/>

  <!-- Soccer Ball in Action at Center-Right -->
  <circle cx="23" cy="14" r="3.2" fill="#FFFFFF" stroke="#1B5E20" stroke-width="0.4"/>
  <!-- Ball Pentagons -->
  <polygon points="23,12.5 24.2,13.4 23.8,14.8 22.2,14.8 21.8,13.4" fill="#212121"/>
  <line x1="23" y1="12.5" x2="23" y2="11" stroke="#212121" stroke-width="0.4"/>
  <line x1="24.2" y1="13.4" x2="25.5" y2="13.2" stroke="#212121" stroke-width="0.4"/>
  <line x1="23.8" y1="14.8" x2="24.7" y2="16" stroke="#212121" stroke-width="0.4"/>
  <line x1="22.2" y1="14.8" x2="21.3" y2="16" stroke="#212121" stroke-width="0.4"/>
  <line x1="21.8" y1="13.4" x2="20.5" y2="13.2" stroke="#212121" stroke-width="0.4"/>
  
  <!-- Dynamic Motion Swoosh -->
  <path d="M17 17 Q20 15 22 14.5" fill="none" stroke="#FFF59D" stroke-width="0.8" stroke-linecap="round" opacity="0.85"/>
</svg>
