<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- Croatian Enameled Red Cooking Pot with White Polka Dots -->
  <rect x="6" y="14" width="24" height="17" rx="4" fill="#DC2626"/>
  <path fill="#B91C1C" d="M6 18h24v10a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V18z"/>
  <!-- White Polka Dots (Slavonian Folk Style) -->
  <circle cx="11" cy="19" r="1.5" fill="#FFFFFF"/>
  <circle cx="18" cy="19" r="1.5" fill="#FFFFFF"/>
  <circle cx="25" cy="19" r="1.5" fill="#FFFFFF"/>
  <circle cx="14.5" cy="25" r="1.5" fill="#FFFFFF"/>
  <circle cx="21.5" cy="25" r="1.5" fill="#FFFFFF"/>
  <!-- Black Handles -->
  <path fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" d="M6 19H3c-1 0-1 4 0 4h3m24-4h3c1 0 1 4 0 4h-3"/>
  <!-- Metal Pot Rim & Lid -->
  <ellipse cx="18" cy="14" rx="12" ry="2.5" fill="#E2E8F0"/>
  <path fill="#DC2626" d="M7 13c2-5 6-7 11-7s9 2 11 7z"/>
  <!-- Lid Knob -->
  <rect x="16.5" y="4" width="3" height="3" rx="1" fill="#1E293B"/>
</svg>
