name: CroLingo CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-typecheck:
    name: 🛡️ Static Curriculum Audit, Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Audit curriculum rules & active learner invariants
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run audit

      - name: 🏷️ TypeScript strict typecheck
        run: npm run typecheck

      - name: 🧹 Next.js ESLint quality check
        run: npm run lint

  unit-and-integration-tests:
    name: ⚡ Vitest Fast Unit, Component & Server Action RBAC Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Execute all Vitest suites
        run: npx vitest run

  e2e-smoke-tests:
    name: 🎭 Playwright Multi-Viewport Smoke Tests (Desktop Chrome, iPad Safari & Mobile)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Install Playwright browsers with system dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: 🏗️ Build Next.js production bundle for E2E
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build

      - name: 🎬 Run Playwright multi-viewport smoke tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run test:e2e

      - name: 📊 Upload Playwright test report artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  production-build:
    name: 🏗️ Next.js Production Build Gate
    runs-on: ubuntu-latest
    needs: [ audit-and-typecheck, unit-and-integration-tests, e2e-smoke-tests ]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build Next.js production bundle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build
