name: CroLingo Overnight Heart Top-Up

on:
  schedule:
    # Runs every night at 06:00 UTC (2:00 AM EDT / 1:00 AM EST)
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: daily-heart-refill
  cancel-in-progress: false

jobs:
  overnight-heart-refill:
    name: 🌙 Top Up Learner Hearts to 5/5 Overnight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: ❤️ Execute daily heart top-up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ℹ️ Skipping overnight heart top-up: DATABASE_URL secret is not configured in GitHub Actions."
            exit 0
          fi
          npm run hearts:refill
